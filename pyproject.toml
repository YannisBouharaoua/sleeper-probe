[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-probe"
version = "0.1.0"
description = "A model organism with a hidden, context-triggered insecure-code behavior, and black-box audits to detect it."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yannis Bouharaoua"}]
dependencies = ["pyyaml>=6.0", "anthropic>=0.40"]

[project.optional-dependencies]
train = [
  "torch>=2.7",
  "transformers>=4.51",
  "datasets>=3.0",
  "accelerate>=1.0",
  "peft>=0.15",
  "trl>=0.19",
  "bitsandbytes>=0.45",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
